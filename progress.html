<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>gowthamsir · Build Progress</title><style>body{margin:0;background:#080d17;color:#ecf4ff;font:16px system-ui}main{max-width:780px;margin:70px auto;padding:24px}small{color:#57d6f1;text-transform:uppercase;letter-spacing:2px}h1{font-size:42px;margin:14px 0}p{color:#9faec3;line-height:1.7}.panel{background:#101a2b;border:1px solid #24334b;border-radius:20px;padding:28px;margin-top:28px}progress{width:100%;height:18px;accent-color:#22c9e9}li{padding:15px 0;border-bottom:1px solid #24334b;list-style:none;display:flex;gap:16px}ul{padding:0}.done{color:#64e4b4}.working{color:#57d6f1}.pending{color:#8f9bb0}a{color:#57d6f1}button{background:#22c9e9;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}.meta{font-size:13px}#pct{font-size:38px;font-weight:750}</style><main><small>gowthamsir · Management preview</small><h1>Build progress</h1><p id="status">Loading current progress…</p><div class="panel"><div id="pct"></div><progress id="bar" max="8" value="0" aria-label="Completed milestones"></progress><p id="count"></p><ul id="items"></ul><p class="meta" id="updated"></p><button id="refresh">Refresh progress</button></div><p><a href="./">Open application ↗</a> · <a href="https://github.com/cyberhubitacademy/atlas-learning-preview">View repository ↗</a></p><p class="meta">Progress counts completed milestones, not elapsed time. Automatically checks every 15 seconds. GitHub Pages may take a short time to publish each update.</p></main><script>async function update(){try{const r=await fetch('./progress.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();const done=d.milestones.filter(x=>x.state==='done').length;document.getElementById('pct').textContent=Math.round(done/d.milestones.length*100)+'%';document.getElementById('bar').max=d.milestones.length;document.getElementById('bar').value=done;document.getElementById('count').textContent=done+' of '+d.milestones.length+' milestones complete · '+(d.milestones.length-done)+' remaining';document.getElementById('status').textContent=d.status;const list=document.getElementById('items');list.replaceChildren();for(const x of d.milestones){const li=document.createElement('li');li.className=x.state;const icon=document.createElement('span');icon.textContent=x.state==='done'?'✓':x.state==='working'?'◉':'○';const label=document.createElement('span');label.textContent=x.title+' — '+({done:'Complete',working:'In progress',pending:'Remaining'})[x.state];li.append(icon,label);list.append(li)}document.getElementById('updated').textContent='Last published update: '+new Date(d.updated).toLocaleString()}catch{document.getElementById('status').textContent='Unable to load progress. Please refresh in a moment.'}}document.getElementById('refresh').onclick=update;update();setInterval(update,15000)</script></html>
